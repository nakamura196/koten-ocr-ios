name: Site
on:
  pull_request:
    branches: [main]
    paths: ["docs/**", "tests/**", "scripts/check-*.mjs", "package.json", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "tests/**", "scripts/check-*.mjs", "package.json", ".github/workflows/site.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # docs/ (紹介ページ) がそのまま Vercel で配られる。公開 URL と参照切れを検査する。
      - run: npm test
