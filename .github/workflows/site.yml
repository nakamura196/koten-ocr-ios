name: Site
on:
  pull_request:
    branches: [main]
    paths: ["docs/**", "CHANGELOG.md", "tests/**", "scripts/check-*.mjs", "package.json", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "CHANGELOG.md", "tests/**", "scripts/check-*.mjs", "package.json", ".github/workflows/site.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # docs/ (紹介サイト) は GitHub Pages が main の docs/ を Jekyll で組み立てて配る。
      # 同じ道具で組み立て、公開 URL と参照切れを検査する。
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
      - run: npm test
